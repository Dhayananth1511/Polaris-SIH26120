services:
  # ── Polaris Backend Web Service ───────────────────────────────────────────
  - type: web
    name: polaris-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    preDeployCommand: cd backend && alembic upgrade head && python scripts/seed_database.py && python scripts/apply_indexes.py
    startCommand: cd backend && uvicorn app.server:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: polaris-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://polaris-frontend.onrender.com,http://localhost:5173
      - key: COOKIE_SAMESITE
        value: lax
      - key: BOOTSTRAP_ADMIN_ID
        value: OIL-AD-0001
      - key: BOOTSTRAP_ADMIN_NAME
        value: System Administrator
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true

  # ── Polaris Frontend Static Site ──────────────────────────────────────────
  - type: static
    name: polaris-frontend
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      # Proxy API calls directly to the backend web service (preserves Same-Origin cookies)
      - type: rewrite
        source: /api/*
        destination: https://polaris-backend.onrender.com/api/*
      # Single-Page Application (SPA) client-side routing fallback
      - type: rewrite
        source: /*
        destination: /index.html

# ── Polaris PostgreSQL Database ─────────────────────────────────────────────
databases:
  - name: polaris-db
    databaseName: polaris_db
    user: polaris_admin
    region: oregon
    plan: free
